<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- VeeKitchen mark: the Persian letter و on a lajvard tile -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a66"/>
      <stop offset="1" stop-color="#17203d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#93aae8" stroke-opacity="0.25" stroke-width="8"/>
  <text x="256" y="345" text-anchor="middle" font-family="Vazirmatn, Tahoma, sans-serif" font-size="280" font-weight="900" fill="#f5f7ff">و</text>
  <circle cx="256" cy="416" r="14" fill="#e8b64c"/>
</svg>
