name: ci

on:
  push:
    branches: [development, testing, main, production]
  pull_request:
    branches: [development, testing, main, production]

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Pint + Pest feature suite

    services:
      # Reverb (websocket) is exercised with the null broadcast driver in
      # tests, so no service container is needed; the suite runs on SQLite
      # in memory, exactly like local `php artisan test`.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate --force

      - name: Run Pint (style)
        run: vendor/bin/pint --test

      - name: Run test suite
        run: php artisan test --compact
